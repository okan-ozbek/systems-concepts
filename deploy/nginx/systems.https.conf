# Replace the bootstrap site file with this AFTER successful certificate issuance.
server {
    listen 80;
    server_name systems.pixelware.nl www.systems.pixelware.nl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot-systems;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://systems.pixelware.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.systems.pixelware.nl;
    ssl_certificate /etc/letsencrypt-systems/live/systems.pixelware.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-systems/live/systems.pixelware.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://systems.pixelware.nl$request_uri;
}

server {
    listen 443 ssl;
    server_name systems.pixelware.nl;
    ssl_certificate /etc/letsencrypt-systems/live/systems.pixelware.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-systems/live/systems.pixelware.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $systems_upstream systems-concepts-web;
        proxy_pass http://$systems_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
