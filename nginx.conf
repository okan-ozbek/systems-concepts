limit_req_zone $binary_remote_addr zone=cpp_compile:1m rate=6r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 24k;
    # Precompressed build assets avoid spending CPU on each download.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    location /api/cpp/ {
        limit_req zone=cpp_compile burst=6 nodelay;
        limit_req_status 429;
        set $compiler cpp-compiler:9000;
        rewrite ^/api/cpp/(.*)$ /$1 break;
        proxy_pass http://$compiler;
        proxy_read_timeout 45s;
        proxy_connect_timeout 3s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    add_header X-Content-Type-Options nosniff;
}
