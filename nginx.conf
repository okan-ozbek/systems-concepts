limit_req_zone $binary_remote_addr zone=cpp_compile:1m rate=6r/m;
limit_req_zone $server_name zone=cpp_global:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=cpp_connections:1m;
limit_conn_zone $server_name zone=cpp_global_connections:1m;
map $http_content_type $cpp_json {
    default 0;
    "~*^application/json[ ]*(;.*)?$" 1;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 24k;
    server_tokens off;
    # Only this exact proxy may supply a visitor IP. Local default is loopback.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    include /etc/nginx/security-headers.conf;
    # Precompressed build assets avoid spending CPU on each download.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    location = /api/cpp/compile {
        if ($request_method != POST) { return 405; }
        if ($cpp_json = 0) { return 415; }
        limit_req zone=cpp_compile burst=6 nodelay;
        limit_req zone=cpp_global burst=6 nodelay;
        limit_req_status 429;
        limit_conn cpp_connections 2;
        limit_conn cpp_global_connections 8;
        limit_conn_status 429;
        set $compiler cpp-compiler:9000;
        proxy_pass http://$compiler/compile;
        proxy_read_timeout 45s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Powered-By;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
